<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#09090B" />
<meta name="color-scheme" content="dark" />
<meta name="robots" content="noindex" />
<title>Choose a new password - TAPX</title>
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>

<body>
<main class="auth-page">
  <div class="auth-shell">

    <header class="auth-head">
      <a class="auth-mark" href="index.html" aria-label="TAPX home">T</a>
      <div>
        <h1 class="auth-title">NEW PASSWORD</h1>
        <p class="auth-subtitle">Pick something you have not used on another site.</p>
      </div>
    </header>

    <section class="auth-card">
      <p class="auth-alert" id="reset-waiting">
        Checking your reset link...
      </p>

      <form class="auth-form" id="reset-form" novalidate hidden autocomplete="on">
        <p class="auth-alert" id="error-form" role="alert"></p>
        <p class="auth-error" id="reset-note"></p>

        <div class="auth-field">
          <label class="auth-field__label" for="reset-password">New password</label>
          <div class="auth-field__wrap">
            <input class="input" type="password" id="reset-password" name="password"
                   placeholder="At least 6 characters" autocomplete="new-password" required />
            <button class="auth-field__toggle" type="button" data-toggle-password="reset-password"
                    aria-label="Show password">Show</button>
          </div>
          <span class="auth-error" id="error-password"></span>
        </div>

        <div class="auth-field">
          <label class="auth-field__label" for="reset-password-confirm">Confirm new password</label>
          <div class="auth-field__wrap">
            <input class="input" type="password" id="reset-password-confirm" name="password_confirm"
                   placeholder="Repeat your new password" autocomplete="new-password" required />
          </div>
          <span class="auth-error" id="error-password-confirm"></span>
        </div>

        <button class="btn btn--primary btn--block" type="submit" id="reset-submit">Update password</button>
      </form>

      <p class="auth-foot">
        <span><a href="login.html">Back to sign in</a></span>
      </p>
    </section>
  </div>
</main>

<script>
if (window.location.protocol === "file:") {
  document.querySelector(".auth-card").innerHTML =
    '<div class="fatal"><h2>Serve this folder over HTTP</h2>' +
    "<p>TAPX uses JavaScript modules, which browsers refuse to load from file:// URLs. " +
    "Run <code>npx serve .</code> inside the tapx folder and open the http://localhost address.</p></div>";
}
</script>
<script type="module">
  import { initResetPassword } from "./js/auth.js";
  initResetPassword();
</script>
</body>
</html>
