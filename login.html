<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#09090B" />
<meta name="color-scheme" content="dark" />
<meta name="robots" content="noindex" />
<title>Sign in - TAPX</title>
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>

<body>
<main class="auth-page">
  <div class="auth-shell">

    <header class="auth-head">
      <a class="auth-mark" href="index.html" aria-label="TAPX home">T</a>
      <div>
        <h1 class="auth-title">TAPX</h1>
        <p class="auth-subtitle">Welcome back. Sign in to keep your coins, combos and upgrades.</p>
      </div>
    </header>

    <section class="auth-card">
      <form class="auth-form" id="login-form" novalidate autocomplete="on">
        <p class="auth-alert" id="error-form" role="alert"></p>

        <!-- Honeypot: hidden from people, irresistible to bots -->
        <div class="hp-field" aria-hidden="true">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <div class="auth-field">
          <label class="auth-field__label" for="login-email">Email</label>
          <div class="auth-field__wrap">
            <input class="input" type="email" id="login-email" name="email"
                   placeholder="you@example.com" autocomplete="email"
                   inputmode="email" required />
          </div>
          <span class="auth-error" id="error-email"></span>
        </div>

        <div class="auth-field">
          <label class="auth-field__label" for="login-password">Password</label>
          <div class="auth-field__wrap">
            <input class="input" type="password" id="login-password" name="password"
                   placeholder="Your password" autocomplete="current-password" required />
            <button class="auth-field__toggle" type="button" data-toggle-password="login-password"
                    aria-label="Show password">Show</button>
          </div>
          <span class="auth-error" id="error-password"></span>
        </div>

        <div class="auth-row">
          <label class="auth-check">
            <input type="checkbox" id="remember" checked />
            <span>Keep me signed in</span>
          </label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button class="btn btn--primary btn--block" type="submit" id="login-submit">Sign in</button>
      </form>

      <p class="auth-foot">
        <span>New to TAPX? <a href="register.html">Create an account</a></span>
      </p>

      <div class="auth-trust">
        <span>🔒 Supabase Auth</span>
        <span>🛡 Row Level Security</span>
        <span>⚡ Instant sync</span>
      </div>
    </section>

    <p class="empty-note">
      <a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Service</a>
    </p>
  </div>
</main>

<script>
if (window.location.protocol === "file:") {
  document.querySelector(".auth-card").innerHTML =
    '<div class="fatal"><h2>Serve this folder over HTTP</h2>' +
    "<p>TAPX uses JavaScript modules, which browsers refuse to load from file:// URLs. " +
    "Run <code>npx serve .</code> inside the tapx folder and open the http://localhost address.</p></div>";
}
</script>
<script type="module">
  import { initLogin } from "./js/auth.js";
  initLogin();
</script>
</body>
</html>
