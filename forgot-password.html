<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#09090B" />
<meta name="color-scheme" content="dark" />
<meta name="robots" content="noindex" />
<title>Reset password - TAPX</title>
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>

<body>
<main class="auth-page">
  <div class="auth-shell">

    <header class="auth-head">
      <a class="auth-mark" href="index.html" aria-label="TAPX home">T</a>
      <div>
        <h1 class="auth-title">RESET</h1>
        <p class="auth-subtitle">Enter your email and we will send a reset link if the account exists.</p>
      </div>
    </header>

    <section class="auth-card">
      <form class="auth-form" id="forgot-form" novalidate>
        <p class="auth-alert" id="error-form" role="alert"></p>

        <div class="hp-field" aria-hidden="true">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <div class="auth-field">
          <label class="auth-field__label" for="forgot-email">Email</label>
          <div class="auth-field__wrap">
            <input class="input" type="email" id="forgot-email" name="email"
                   placeholder="you@example.com" autocomplete="email" required />
          </div>
          <span class="auth-error" id="error-email"></span>
        </div>

        <button class="btn btn--primary btn--block" type="submit" id="forgot-submit">Send reset link</button>
      </form>

      <div id="forgot-done" hidden>
        <p class="auth-alert auth-alert--ok">
          If that email is registered, a reset link is on its way. The link expires
          after a short time - check your spam folder if nothing arrives.
        </p>
      </div>

      <p class="auth-foot">
        <span>Remembered it? <a href="login.html">Back to sign in</a></span>
      </p>
    </section>
  </div>
</main>

<script>
if (window.location.protocol === "file:") {
  document.querySelector(".auth-card").innerHTML =
    '<div class="fatal"><h2>Serve this folder over HTTP</h2>' +
    "<p>TAPX uses JavaScript modules, which browsers refuse to load from file:// URLs. " +
    "Run <code>npx serve .</code> inside the tapx folder and open the http://localhost address.</p></div>";
}
</script>
<script type="module">
  import { initForgotPassword } from "./js/auth.js";
  initForgotPassword();
</script>
</body>
</html>
